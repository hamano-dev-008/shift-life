<!doctype html>
<!-- index.html — Renderer page: the companion window's scene and controls. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'">
  <title>Shift-Life</title>
  <link rel="stylesheet" href="../node_modules/@fontsource/press-start-2p/400.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="renderer.js"></script>
</head>
<body>
  <main id="app">
    <canvas id="scene"></canvas>
    <!-- Invisible click areas over the place's clickable props (the tree,
         the house, the sofa, the front door); filled in by the renderer. -->
    <div id="targets"></div>
    <div id="character-target" hidden></div>
    <!-- Invisible click target over the "!" bubble drawn on the canvas. -->
    <button id="event-bubble" title="Something's happening!" aria-label="Open event" hidden></button>
    <!-- The same, over the "!" when a fish bites: click to reel it in. -->
    <button id="bite-bubble" title="A bite! Reel it in" aria-label="Reel in" hidden></button>
    <!-- Invisible, over a catch's reveal card (canvas art): click to close
         it sooner. -->
    <button id="reveal-close" title="Close" aria-label="Close the catch" hidden></button>
    <!-- What's running (fishing, busking, resting), with Stop. -->
    <div id="activity-bar" hidden>
      <span class="bar-text"></span>
      <button class="bar-stop"></button>
    </div>
    <div id="speech" hidden></div>
    <section id="event-card" class="panel" hidden>
      <button class="panel-close" title="Decide later" aria-label="Decide later">x</button>
      <p class="event-prompt"></p>
      <div class="event-choices"></div>
    </section>
    <section id="goal-menu" class="panel" hidden>
      <button class="panel-close" title="Close" aria-label="Close">x</button>
      <h2 class="goal-title">Life goal</h2>
      <div class="goal-options"></div>
      <p class="goal-status"></p>
      <ul class="goal-milestones"></ul>
    </section>
    <section id="tree-menu" class="panel" hidden>
      <button class="panel-close" title="Close" aria-label="Close">x</button>
      <h2 class="goal-title menu-title"></h2>
      <div class="menu-options"></div>
      <p class="menu-status"></p>
    </section>
    <section id="rest-menu" class="panel" hidden>
      <button class="panel-close" title="Close" aria-label="Close">x</button>
      <h2 class="goal-title menu-title"></h2>
      <div class="menu-options"></div>
      <p class="menu-status"></p>
    </section>
    <!-- An activity's menu (the dock: fishing), and the fish collection. -->
    <section id="activity-menu" class="panel scroll" hidden>
      <button class="panel-close" title="Close" aria-label="Close">x</button>
      <h2 class="goal-title menu-title"></h2>
      <div class="menu-options"></div>
      <div class="menu-status"></div>
    </section>
    <section id="go-menu" class="panel" hidden>
      <button class="panel-close" title="Close" aria-label="Close">x</button>
      <h2 class="goal-title menu-title"></h2>
      <div class="menu-options"></div>
      <p class="menu-status"></p>
    </section>
    <!-- The life summary, shown after a life ends. -->
    <section id="summary-card" class="panel scroll" hidden>
      <button class="panel-close" title="Close" aria-label="Close">x</button>
      <div class="summary-body"></div>
      <div class="menu-options"></div>
    </section>
    <!-- The Book of past lives: every finished life. -->
    <section id="book-menu" class="panel scroll" hidden>
      <button class="panel-close" title="Close" aria-label="Close">x</button>
      <div class="book-body"></div>
    </section>
    <!-- Developer settings; the gear only shows when running from source. -->
    <section id="dev-menu" class="panel" hidden>
      <button class="panel-close" title="Close" aria-label="Close">x</button>
      <h2 class="goal-title">Dev settings</h2>
      <div class="dev-body"></div>
      <p class="dev-readout"></p>
    </section>
    <div id="label" title="Stats (click to pin)"></div>
    <div id="place"></div>
    <div id="stats" hidden></div>
    <div id="controls">
      <button id="goal-btn" title="Life goal" hidden></button>
      <button id="book-btn" title="Book of past lives" aria-label="Book of past lives" hidden>
        <!-- 8x8 pixel book. -->
        <svg viewBox="0 0 8 8" width="8" height="8" shape-rendering="crispEdges" aria-hidden="true">
          <path fill="currentColor" d="M1 0h7v1h-7zM0 1h1v6h-1zM2 1h1v5h-1zM7 1h1v5h-1zM4 2h2v1h-2zM1 6h7v1h-7zM1 7h6v1h-6z"/>
        </svg>
      </button>
      <button id="go-btn" title="Go to" aria-label="Go to">
        <!-- 8x8 pixel map pin. -->
        <svg viewBox="0 0 8 8" width="8" height="8" shape-rendering="crispEdges" aria-hidden="true">
          <path fill="currentColor" d="M2 0h4v1h-4zM1 1h2v1h-2zM5 1h2v1h-2zM1 2h1v2h-1zM6 2h1v2h-1zM1 4h2v1h-2zM5 4h2v1h-2zM2 5h4v1h-4zM3 6h2v1h-2z"/>
        </svg>
      </button>
      <button id="dev-btn" title="Dev settings" aria-label="Dev settings" hidden>
        <!-- 8x8 pixel gear. -->
        <svg viewBox="0 0 8 8" width="8" height="8" shape-rendering="crispEdges" aria-hidden="true">
          <path fill="currentColor" d="M3 0h2v1h-2zM1 1h1v1h-1zM6 1h1v1h-1zM3 1h2v1h-2zM2 2h4v1h-4zM0 3h3v2h-3zM5 3h3v2h-3zM2 5h4v1h-4zM1 6h1v1h-1zM3 6h2v1h-2zM6 6h1v1h-1zM3 7h2v1h-2z"/>
        </svg>
      </button>
      <button id="minimize-btn" title="Minimize" aria-label="Minimize">-</button>
      <button id="close-btn" title="Close" aria-label="Close">x</button>
    </div>
  </main>
</body>
</html>
